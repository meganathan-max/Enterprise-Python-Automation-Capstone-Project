[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-python-automation-capstone"
version = "1.0.0"
description = "Automated PDF report generation and scheduling CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["reportlab>=4.0", "python-dotenv>=1.0"]

[project.scripts]
enterprise-report = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
